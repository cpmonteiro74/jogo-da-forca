<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo da Forca</title>
<style>
  :root {
    --bg1: #0b1120; --bg2: #1e1b4b;
    --card: #172033; --card-hi: #1f2b45; --border: #2e3b55;
    --text: #f1f5f9; --muted: #94a3b8; --dim: #55627a;
    --accent: #f59e0b; --accent2: #38bdf8;
    --ok: #22c55e; --err: #ef4444; --ok-dark: #14532d; --err-dark: #5b1a1f;
    --key: #2b3a55; --key-hi: #3a4b6b; --wood: #b7791f; --wood-dark: #7c4a12;
    --rope: #d6d3d1; --body: #f8fafc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Ubuntu", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 88% 10%, #12304a 0 160px, transparent 161px),
                radial-gradient(circle at 6% 92%, #232a5c 0 200px, transparent 201px),
                linear-gradient(180deg, var(--bg1), var(--bg2)) fixed;
    background-color: var(--bg1);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .hidden { display: none !important; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 28px; }

  /* ---------- Menu ---------- */
  #menu { text-align: center; padding-top: 24px; }
  .logo { display: flex; align-items: center; justify-content: center; gap: 22px; }
  .logo svg { width: 70px; height: 92px; }
  .logo h1 {
    margin: 0; font-size: clamp(48px, 11vw, 78px); letter-spacing: 4px; color: var(--accent);
    text-shadow: 3px 4px 0 #000;
  }
  .sub { color: var(--muted); margin: 8px 0 30px; }
  .label { font-weight: 700; letter-spacing: 2px; font-size: 14px; margin: 26px 0 14px; }
  .levels { display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); gap: 20px; justify-content: center; }
  .level {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 20px;
    padding: 18px 10px; transition: transform .12s, border-color .12s, background .12s;
  }
  .level:hover { transform: translateY(-2px); border-color: var(--muted); }
  .level.sel { background: var(--card-hi); border: 3px solid var(--accent); padding: 16.5px 8.5px; }
  .level b { display: block; font-size: 22px; }
  .level.sel b { color: var(--accent); }
  .level span { display: block; color: var(--muted); font-size: 13px; margin-top: 6px; }
  .level small { display: block; color: var(--dim); font-size: 12px; margin-top: 4px; }
  .themes { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .theme {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 999px;
    padding: 11px 20px; font-weight: 700; font-size: 15px; transition: background .12s;
  }
  .theme:hover { background: var(--card-hi); }
  .theme.sel { background: var(--accent2); border-color: var(--accent2); color: #0b1120; }
  .theme em { font-style: normal; opacity: .7; font-weight: 500; margin-left: 4px; }
  .btn {
    background: var(--accent); color: #0b1120; font-weight: 800; border-radius: 16px;
    padding: 14px 28px; font-size: 17px; transition: filter .12s, transform .12s;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: scale(.98); }
  .btn.dark { background: var(--key); color: var(--text); }
  .btn.play { margin-top: 36px; width: 280px; max-width: 100%; font-size: 22px; padding: 18px; letter-spacing: 2px; }
  .stats-line { color: var(--muted); margin-top: 26px; min-height: 1.2em; }
  .foot { color: var(--dim); font-size: 13px; margin-top: 22px; }

  /* ---------- Jogo ---------- */
  header.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  header.bar .brand { font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: 1px; }
  .stats { display: flex; gap: 26px; }
  .stat { text-align: center; }
  .stat small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 1px; }
  .stat b { font-size: 17px; }
  .grid { display: grid; grid-template-columns: 440px minmax(0, 1fr); gap: 28px; }
  .card { background: var(--card); border: 1.5px solid var(--border); border-radius: 24px; }
  .gallows { padding: 20px 20px 16px; display: flex; flex-direction: column; align-items: center; }
  .gallows > svg { width: 100%; max-width: 380px; height: auto; }
  .part { opacity: 0; transition: opacity .2s; }
  .part.on { opacity: 1; }
  .part.flash { stroke: var(--err) !important; }
  .lost .part, .lost .face * { stroke: var(--err); }
  .lost .face .eye-dot { fill: var(--err); }
  .lives-txt { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .hearts { display: flex; gap: 8px; margin-top: 6px; }
  .hearts svg { width: 24px; height: 22px; display: block; }
  .hearts path { fill: var(--err); transition: fill .25s; }
  .hearts .lost path { fill: var(--dim); }

  .right { display: flex; flex-direction: column; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .chip { border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 15px; border: 1.5px solid; }
  .chip.lvl { color: var(--accent2); border-color: var(--accent2); background: #1b3550; }
  .chip.tema { color: var(--accent); border-color: var(--accent); background: #3a2f22; }
  .chips .note { color: var(--dim); font-size: 12px; margin-left: auto; }

  .word { min-width: 0; overflow: hidden; min-height: 190px; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 18px 0; }
  .line { display: flex; justify-content: center; }
  .slot {
    width: var(--s); height: calc(var(--s) * 1.2); display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--s) * .58); font-weight: 800; position: relative;
  }
  .slot.letter::after {
    content: ""; position: absolute; left: 14%; right: 14%; bottom: 2px; height: 4px; border-radius: 2px;
    background: var(--dim);
  }
  .slot.rev::after { background: var(--accent); }
  .win .slot.rev::after { background: var(--ok); }
  .slot.rev span { animation: pop .28s ease-out; }
  .slot.miss { color: var(--err); }
  .slot.sep { color: var(--muted); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .shake { animation: shake .3s; }
  @keyframes shake { 20% { transform: translateX(10px); } 40% { transform: translateX(-10px); } 60% { transform: translateX(7px); } 80% { transform: translateX(-4px); } }

  .hint { padding: 16px 22px; min-height: 112px; }
  .hint h3 { margin: 0 0 8px; color: var(--accent); font-size: 15px; letter-spacing: 1px; }
  .hint p { margin: 0; line-height: 1.45; }
  .hint .wait { color: var(--muted); }
  .hint .buy { margin-top: 10px; background: var(--key); color: var(--accent); border-radius: 10px; padding: 7px 14px; font-size: 13px; font-weight: 700; }
  .hint .buy:hover { background: var(--key-hi); }

  .kbd { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .krow { display: flex; gap: 8px; justify-content: center; width: 100%; }
  .key {
    width: 50px; height: 54px; flex: 0 1 50px; border-radius: 12px; background: var(--key);
    font-size: 18px; font-weight: 800; transition: background .12s, transform .08s;
  }
  .key:hover:not(:disabled) { background: var(--key-hi); }
  .key:active:not(:disabled) { transform: scale(.94); }
  .key:disabled { cursor: default; color: var(--dim); }
  .key.ok { background: var(--ok-dark); color: var(--ok); box-shadow: inset 0 0 0 1.5px var(--ok); }
  .key.bad { background: var(--err-dark); color: #a8a29e; box-shadow: inset 0 0 0 1.5px var(--err); }
  .help { text-align: center; color: var(--dim); font-size: 12px; margin-top: 14px; }

  /* ---------- Resultado ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(2, 6, 18, .72); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
    animation: fade .25s;
  }
  @keyframes fade { from { opacity: 0; } }
  .modal {
    background: var(--card); border: 3px solid var(--ok); border-radius: 28px; padding: 28px 30px 20px;
    width: 520px; max-width: 100%; text-align: center; animation: rise .3s ease-out;
  }
  @keyframes rise { from { transform: translateY(24px) scale(.96); opacity: 0; } }
  .modal.lose { border-color: var(--err); }
  .modal h2 { margin: 0 0 10px; font-size: 32px; color: var(--ok); }
  .modal.lose h2 { color: var(--err); }
  .modal .was { color: var(--muted); margin: 0; }
  .modal .w { font-size: 26px; font-weight: 800; margin: 4px 0 12px; word-break: break-word; }
  .modal .gain { color: var(--accent); font-weight: 700; margin: 0 0 14px; }
  .modal .det { color: var(--muted); margin: 0 0 22px; line-height: 1.45; }
  .modal .acts { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .modal .acts .btn { flex: 1 1 160px; }
  .modal .foot { margin-top: 14px; }
  .sound { padding: 10px 14px; font-size: 15px; min-width: 48px; }
  .sound-menu { margin-top: 14px; background: transparent; color: var(--muted); font-size: 14px; padding: 6px 12px; border-radius: 10px; }
  .sound-menu:hover { background: var(--card); color: var(--text); }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  /* ---------- Responsivo ---------- */
  @media (max-width: 900px) {
    .grid { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .gallows { flex-direction: row; justify-content: center; gap: 18px; padding: 12px; }
    .gallows > svg { width: 150px; }
    .gallows .lives { display: flex; flex-direction: column; align-items: center; }
    .stats { gap: 14px; }
  }
  @media (max-width: 640px) {
    .levels { grid-template-columns: 1fr; max-width: 320px; margin: 0 auto; gap: 12px; }
    .level { padding: 12px; } .level.sel { padding: 10.5px; }
    .logo svg { width: 50px; height: 66px; }
    header.bar { flex-wrap: wrap; }
    header.bar .brand { font-size: 22px; }
    .stats { order: 3; width: 100%; justify-content: space-between; }
    .word { min-height: 130px; }
    .krow { gap: 5px; } .kbd { gap: 6px; }
    .key { height: 48px; font-size: 16px; border-radius: 9px; min-width: 0; }
    .chips .note { display: none; }
    .modal { padding: 22px 18px 16px; }
    .modal h2 { font-size: 26px; }
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<!-- ================= MENU ================= -->
<section id="menu" class="wrap">
  <div class="logo">
    <svg viewBox="0 0 70 92" aria-hidden="true">
      <g stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M4 88 H56 M14 88 V4 H54" stroke="#b7791f" stroke-width="6"/>
        <path d="M54 4 V18" stroke="#d6d3d1" stroke-width="2"/>
        <g stroke="#f8fafc" stroke-width="3">
          <circle cx="54" cy="27" r="9"/><path d="M54 36 V64 M42 48 L54 42 L66 48 M44 80 L54 64 L64 80"/>
        </g>
      </g>
    </svg>
    <h1>FORCA</h1>
  </div>
  <p class="sub">Adivinhe a palavra antes que o boneco seja enforcado</p>

  <div class="label">DIFICULDADE</div>
  <div class="levels" id="levels"></div>

  <div class="label">TEMA</div>
  <div class="themes" id="themes"></div>

  <button class="btn play" id="btnPlay">JOGAR</button>
  <div class="stats-line" id="statsLine"></div>
  <button class="sound-menu" id="btnSomMenu"></button>
  <div class="foot">Enter para jogar · Use o teclado ou o mouse/toque</div>
</section>

<!-- ================= JOGO ================= -->
<section id="game" class="wrap hidden">
  <header class="bar">
    <div class="brand">FORCA</div>
    <div class="stats">
      <div class="stat"><small>PONTOS</small><b id="sPts">0</b></div>
      <div class="stat"><small>SEQUÊNCIA</small><b id="sSeq">0</b></div>
      <div class="stat"><small>VITÓRIAS</small><b id="sWin">0</b></div>
      <div class="stat"><small>DERROTAS</small><b id="sLose">0</b></div>
    </div>
    <div style="display:flex;gap:8px"><button class="btn dark sound" id="btnSom" title="Ligar/desligar som"></button><button class="btn dark" id="btnMenu" style="padding:10px 22px;font-size:15px">Menu</button></div>
  </header>

  <div class="grid">
    <div class="card gallows" id="gallows">
      <svg viewBox="0 0 400 520" aria-label="Forca">
        <g stroke-linecap="round" stroke-linejoin="round" fill="none">
          <g transform="translate(4 4)" stroke="var(--wood-dark)">
            <path d="M40 490 H300" stroke-width="14"/>
            <path d="M90 490 V30 H310" stroke-width="12"/>
            <path d="M90 95 L155 30" stroke-width="8"/>
          </g>
          <g stroke="var(--wood)">
            <path d="M40 490 H300" stroke-width="14"/>
            <path d="M90 490 V30 H310" stroke-width="12"/>
            <path d="M90 95 L155 30" stroke-width="8"/>
          </g>
          <path d="M300 34 V80" stroke="var(--rope)" stroke-width="4"/>
          <g stroke="var(--body)" stroke-width="7">
            <circle class="part" id="p0" cx="300" cy="115" r="35" fill="var(--card)" stroke-width="6"/>
            <path class="part" id="p1" d="M300 150 V270"/>
            <path class="part" id="p2" d="M300 175 L250 235"/>
            <path class="part" id="p3" d="M300 175 L350 235"/>
            <path class="part" id="p4" d="M300 270 L258 355"/>
            <path class="part" id="p5" d="M300 270 L342 355"/>
          </g>
          <g class="face hidden" id="face" stroke="var(--body)" stroke-width="3"></g>
        </g>
      </svg>
      <div class="lives">
        <div class="lives-txt" id="livesTxt"></div>
        <div class="hearts" id="hearts"></div>
      </div>
    </div>

    <div class="right">
      <div class="chips">
        <span class="chip lvl" id="chipLvl"></span>
        <span class="chip tema" id="chipTema"></span>
        <span class="note" id="temaNote">tema revelado no 1º erro</span>
      </div>
      <div class="word" id="word"></div>
      <div class="card hint" id="hint"></div>
      <div class="kbd" id="kbd"></div>
      <div class="help">Digite ou clique nas letras · Esc: menu</div>
    </div>
  </div>
</section>

<!-- ================= RESULTADO ================= -->
<div class="overlay hidden" id="overlay">
  <div class="modal" id="modal">
    <h2 id="rTitle"></h2>
    <p class="was">A palavra era</p>
    <div class="w" id="rWord"></div>
    <p class="gain" id="rGain"></p>
    <p class="det" id="rDet"></p>
    <div class="acts">
      <button class="btn" id="btnAgain">Jogar novamente</button>
      <button class="btn dark" id="btnMenu2">Menu</button>
    </div>
    <div class="foot">Enter: jogar novamente · Esc: menu</div>
  </div>
</div>

<script>
/* Base gerada a partir de Base_Palavras.csv (duplicatas agrupadas por tema + palavra). */
const PALAVRAS = [{"tema":"frutas","palavra":"MELANCIA","dicas":{"Difícil":"Verde por fora, doce dentro.","Médio":"Verde por fora, doce e suculenta por dentro, refresca no verão.","Fácil":"Verde por fora, vermelha por dentro, refrescante e doce, perfeita para dias quentes de verão."}},{"tema":"frutas","palavra":"ABACAXI","dicas":{"Difícil":"Coroa espinhosa, sabor tropical doce.","Médio":"Tropical, doce e espinhosa, sua coroa é sua marca registrada.","Fácil":"Essa fruta tropical tem uma coroa espinhosa e é conhecida por seu sabor doce e ácido."}},{"tema":"frutas","palavra":"KIWI","dicas":{"Difícil":"Verde por fora, doce dentro.","Médio":"Verde por fora, doce por dentro, sementes pretas em contraste.","Fácil":"Verde por fora, com sementes pretas e polpa suculenta, é uma explosão de sabor tropical."}},{"tema":"frutas","palavra":"BANANA","dicas":{"Difícil":"Amarela, doce, rica em potássio.","Médio":"Amarela por fora, doce por dentro, perfeita para um lanche.","Fácil":"Amarela por fora, doce por dentro, frequentemente curvada, é perfeita para um lanche rápido."}},{"tema":"frutas","palavra":"MANGA","dicas":{"Difícil":"Tropical, suculenta, doce e amarela.","Médio":"É tropical, suculenta e sua cor lembra o pôr do sol.","Fácil":"É uma fruta tropical, suculenta e doce, com casca colorida e polpa amarela vibrante."}},{"tema":"frutas","palavra":"LARANJA","dicas":{"Difícil":"Cor vibrante, suco cítrico refrescante.","Médio":"Ela é cítrica, redonda, vibrante e rica em vitamina C.","Fácil":"É uma esfera vibrante, cheia de suco, que traz o sol em sua cor e sabor."}},{"tema":"frutas","palavra":"CAJU","dicas":{"Difícil":"Nordeste brasileiro, sabor único, castanha.","Médio":"Possui uma castanha famosa e é símbolo do Nordeste brasileiro.","Fácil":"Originária do Brasil, essa fruta tem uma castanha famosa e é usada em sucos e doces."}},{"tema":"frutas","palavra":"MORANGO","dicas":{"Difícil":"Vermelha, doce, pequena e suculenta.","Médio":"Vermelha, doce e pequena, combina bem com chantilly  pelagem dourada e juba, vive na Mata Atlântica.","Fácil":"Primata da Mata Atlântica com pelagem alaranjada e juba, símbolo da luta contra a extinção."}},{"tema":"animais","palavra":"LOBO-GUARÁ","dicas":{"Difícil":"Pernas longas, pelagem laranja, cerrado.","Médio":"Canídeo de pernas longas, estampado na nota de duzentos reais.","Fácil":"Maior canídeo da América do Sul, tem pelagem alaranjada, pernas longas e vive no cerrado."}},{"tema":"aves","palavra":"ÁGUIA","dicas":{"Difícil":"Ave de rapina, visão aguçada.","Médio":"Ave de rapina poderosa, voa alto e tem visão impressionante.","Fácil":"Ave de rapina com garras e visão aguçada, símbolo de poder em brasões e bandeiras."}},{"tema":"aves","palavra":"GAVIÃO","dicas":{"Difícil":"Rapina menor, caça em voo.","Médio":"Ave de rapina que caça pequenos animais com garras afiadas.","Fácil":"Ave de rapina de porte médio, que mergulha rapidamente do céu para capturar pequenos animais."}},{"tema":"aves","palavra":"URUBU","dicas":{"Difícil":"Ave preta que come carniça.","Médio":"Ave preta que plana e se alimenta de animais mortos.","Fácil":"Ave preta de cabeça pelada que plana em círculos e limpa a natureza comendo carniça."}},{"tema":"aves","palavra":"FALCÃO","dicas":{"Difícil":"Ave mais rápida do mundo.","Médio":"Ave de rapina veloz, usada em caça esportiva por séculos.","Fácil":"Ave de rapina que passa de trezentos quilômetros por hora mergulhando, o animal mais rápido."}},{"tema":"aves","palavra":"POMBO","dicas":{"Difícil":"Comum nas praças, arrulha muito.","Médio":"Ave cinzenta comum nas praças, já foi usada como mensageira.","Fácil":"Ave urbana cinzenta que arrulha nas praças e, no passado, levava mensagens entre cidades distantes."}},{"tema":"aves","palavra":"GALINHA","dicas":{"Difícil":"Bota ovos e cacareja muito.","Médio":"Ave do quintal que cacareja, cisca e bota ovos diariamente.","Fácil":"Ave doméstica que cacareja, cisca o terreiro em busca de grãos e fornece ovos frescos."}},{"tema":"aves","palavra":"PATO","dicas":{"Difícil":"Faz quá-quá e nada bem.","Médio":"Bico achatado, pés palmados, nada em lagos e faz quá-quá.","Fácil":"Ave de bico achatado e pés com membranas, nada em lagos e grasna fazendo quá-quá."}},{"tema":"aves","palavra":"GANSO","dicas":{"Difícil":"Grande, branco, ótimo vigia barulhento.","Médio":"Ave grande e barulhenta, ótima vigia de quintais e fazendas.","Fácil":"Ave maior que o pato, de pescoço longo, grasna alto e defende território com bravura."}},{"tema":"aves","palavra":"PERU","dicas":{"Difícil":"Ave típica da ceia natalina.","Médio":"Ave grande de papo vermelho, prato principal em ceias natalinas.","Fácil":"Ave grande que abre a cauda em leque, faz glu-glu e é servida no Natal."}},{"tema":"aves","palavra":"CISNE","dicas":{"Difícil":"Ave elegante de pescoço curvo.","Médio":"Ave aquática branca e elegante, de pescoço longo em curva.","Fácil":"Ave aquática elegante de pescoço longo e curvado, que inspirou um famoso balé de Tchaikovsky."}},{"tema":"aves","palavra":"GAIVOTA","dicas":{"Difícil":"Ave branca das praias, barulhenta.","Médio":"Ave marinha branca e cinza que sobrevoa praias e portos.","Fácil":"Ave marinha branca e cinzenta, sempre perto de praias e barcos, disputando restos de peixe."}},{"tema":"aves","palavra":"PELICANO","dicas":{"Difícil":"Bico com bolsa para peixes.","Médio":"Ave aquática com uma grande bolsa no bico para pescar.","Fácil":"Ave aquática que mergulha para pescar e guarda peixes numa bolsa elástica sob o bico."}},{"tema":"aves","palavra":"ANDORINHA","dicas":{"Difícil":"Migra em bandos, anuncia verão.","Médio":"Pequena ave de cauda bifurcada que migra em grandes bandos.","Fácil":"Ave de cauda bifurcada que migra em bandos; diz o ditado: sozinha não faz verão."}},{"tema":"aves","palavra":"SABIÁ","dicas":{"Difícil":"Canta bonito, ave nacional brasileira.","Médio":"Ave símbolo do Brasil, famosa pelo canto melodioso ao amanhecer.","Fácil":"Ave símbolo do Brasil, de peito alaranjado, cantada na Canção do Exílio de Gonçalves Dias."}},{"tema":"aves","palavra":"BEM-TE-VI","dicas":{"Difícil":"Grita o próprio nome alto.","Médio":"Peito amarelo, faixa branca na cabeça, canta o próprio nome.","Fácil":"Ave comum nas cidades, de peito amarelo e máscara preta, cujo canto repete seu nome."}},{"tema":"aves","palavra":"JOÃO-DE-BARRO","dicas":{"Difícil":"Constrói ninho de argila redondo.","Médio":"Pássaro marrom que constrói ninho de argila parecido com forno.","Fácil":"Pássaro marrom, símbolo da Argentina, ergue com lama e palha um ninho que lembra forno."}},{"tema":"aves","palavra":"QUERO-QUERO","dicas":{"Difícil":"Vigia gramados e ataca intrusos.","Médio":"Ave dos gramados que grita e defende seu ninho bravamente.","Fácil":"Ave comum em campos e estádios, tem esporões nas asas, grita e defende o ninho."}},{"tema":"aves","palavra":"SERIEMA","dicas":{"Difícil":"Pernas longas, canto alto, cerrado.","Médio":"Ave do cerrado de pernas longas, topete e canto escandaloso.","Fácil":"Ave do cerrado que prefere correr a voar, tem topete e canto ouvido de longe."}},{"tema":"aves","palavra":"EMA","dicas":{"Difícil":"Maior ave brasileira, não voa.","Médio":"Ave dos campos brasileiros que corre rápido mas não voa.","Fácil":"Maior ave das Américas, parente do avestruz, corre rápido e o macho choca os ovos."}},{"tema":"aves","palavra":"GRALHA-AZUL","dicas":{"Difícil":"Planta pinheiros enterrando seus pinhões.","Médio":"Ave símbolo do Paraná que enterra pinhões e planta araucárias.","Fácil":"Ave símbolo do Paraná, de cabeça preta, que esquece pinhões enterrados e assim planta araucárias."}},{"tema":"aves","palavra":"CORVO","dicas":{"Difícil":"Ave preta, inteligente e misteriosa.","Médio":"Ave toda preta, inteligente, associada a mistério e mau agouro.","Fácil":"Ave toda preta, considerada uma das mais inteligentes, famosa no poema de Edgar Allan Poe."}},{"tema":"aves","palavra":"CEGONHA","dicas":{"Difícil":"Dizem que traz os bebês.","Médio":"Ave de pernas longas que, segundo a lenda, entrega bebês.","Fácil":"Ave de pernas e bico longos que faz ninhos em telhados; na lenda, traz bebês."}},{"tema":"aves","palavra":"MARTIM-PESCADOR","dicas":{"Difícil":"Mergulha rápido para pegar peixes.","Médio":"Ave colorida de bico longo, mergulha em rios caçando peixes.","Fácil":"Ave de bico comprido que espera em galhos sobre rios e mergulha para capturar peixes."}},{"tema":"aves","palavra":"ALBATROZ","dicas":{"Difícil":"Maior envergadura entre as aves.","Médio":"Ave marinha de asas enormes que plana horas sobre oceanos.","Fácil":"Ave marinha de maior envergadura do mundo, plana milhares de quilômetros quase sem bater asas."}},{"tema":"aves","palavra":"CODORNA","dicas":{"Difícil":"Bota ovinhos pequenos e pintados.","Médio":"Ave de criação, seus ovos pintados viram petiscos em festas.","Fácil":"Pequena ave de penas marrons, criada em granjas por seus ovinhos pintados, servidos como petisco."}},{"tema":"aves","palavra":"CURIÓ","dicas":{"Difícil":"Pássaro preto de canto valorizado.","Médio":"Pequeno pássaro de canto famoso, macho preto com peito avermelhado.","Fácil":"Pequeno pássaro brasileiro de canto muito apreciado, cujo macho é preto com o peito castanho-avermelhado."}},{"tema":"aves","palavra":"UIRAPURU","dicas":{"Difícil":"Canto raro e mágico amazônico.","Médio":"Pássaro amazônico de canto tão belo que a floresta silencia.","Fácil":"Pássaro da Amazônia, protagonista de lendas, cujo canto raro faz os animais pararem para ouvir."}},{"tema":"aves","palavra":"HARPIA","dicas":{"Difícil":"Águia mais poderosa das Américas.","Médio":"Grande ave de rapina amazônica que caça macacos e preguiças.","Fácil":"Chamada gavião-real, é a ave de rapina mais poderosa do Brasil, com garras e penacho."}},{"tema":"aves","palavra":"CARCARÁ","dicas":{"Difícil":"Ave de rapina do sertão.","Médio":"Ave de rapina do sertão, com cara vermelha e topete.","Fácil":"Ave de rapina oportunista que anda pelo chão, de face avermelhada e um topete preto."}},{"tema":"aves","palavra":"TUIUIÚ","dicas":{"Difícil":"Ave símbolo do Pantanal mato-grossense.","Médio":"Ave símbolo do Pantanal, com pescoço preto e colar vermelho.","Fácil":"Grande cegonha do Pantanal, de corpo branco, cabeça preta e uma faixa vermelha no pescoço."}},{"tema":"lugar","palavra":"PRAIA","dicas":{"Difícil":"Areia, mar, sol e conchas.","Médio":"Areia e ondas, ótimo para tomar sol e construir castelos.","Fácil":"Faixa de areia à beira-mar onde pessoas tomam sol, mergulham nas ondas e constroem castelos."}},{"tema":"lugar","palavra":"ESCOLA","dicas":{"Difícil":"Lugar de aprender com professores.","Médio":"Lugar onde crianças estudam, fazem provas e brincam no recreio.","Fácil":"Tem salas de aula, quadro e carteiras, onde alunos aprendem com professores e fazem amigos."}},{"tema":"lugar","palavra":"HOSPITAL","dicas":{"Difícil":"Médicos cuidam dos doentes aqui.","Médio":"Lugar com médicos, enfermeiros e ambulâncias, onde cuidamos da saúde.","Fácil":"Funciona dia e noite com médicos e enfermeiros, recebendo ambulâncias e tratando doentes ou feridos."}},{"tema":"lugar","palavra":"BIBLIOTECA","dicas":{"Difícil":"Estantes cheias de livros, silêncio.","Médio":"Lugar silencioso com estantes de livros que podemos pegar emprestados.","Fácil":"Espaço cheio de estantes, onde é possível ler, estudar e levar livros emprestados para casa."}},{"tema":"lugar","palavra":"MUSEU","dicas":{"Difícil":"Guarda obras de arte antigas.","Médio":"Lugar que exibe obras de arte, fósseis e objetos históricos.","Fácil":"Edifício que preserva e exibe obras de arte, fósseis e objetos históricos para visitantes admirarem."}},{"tema":"lugar","palavra":"CINEMA","dicas":{"Difícil":"Tela grande, pipoca e escuro.","Médio":"Sala escura com tela gigante, onde assistimos filmes comendo pipoca.","Fácil":"Sala escura com poltronas e tela enorme, onde compramos ingresso para assistir filmes comendo pipoca."}},{"tema":"lugar","palavra":"TEATRO","dicas":{"Difícil":"Atores se apresentam no palco.","Médio":"Tem palco e cortinas, onde atores apresentam peças ao vivo.","Fácil":"Espaço tuição financeira com agências e caixas eletrônicos, onde abrimos contas, guardamos dinheiro e pedimos empréstimos."}},{"tema":"lugar","palavra":"CORREIOS","dicas":{"Difícil":"Envia cartas, encomendas e telegramas.","Médio":"Onde enviamos cartas e encomendas para qualquer parte do país.","Fácil":"Tem agências de fachada amarela e azul, onde despachamos cartas e pacotes e compramos selos."}},{"tema":"lugar","palavra":"HOTEL","dicas":{"Difícil":"Hospedagem com quartos para viajantes.","Médio":"Onde turistas se hospedam em quartos com recepção e serviço.","Fácil":"Estabelecimento com recepção, quartos e café da manhã, onde viajantes pagam diárias para se hospedar."}},{"tema":"lugar","palavra":"ACAMPAMENTO","dicas":{"Difícil":"Barracas, fogueira e noite estrelada.","Médio":"Lugar na natureza onde montamos barracas e acendemos uma fogueira.","Fácil":"Área ao ar livre onde montamos barracas, acendemos fogueira, contamos histórias e dormimos sob estrelas."}},{"tema":"lugar","palavra":"CIRCO","dicas":{"Difícil":"Palhaços, malabaristas e lona colorida.","Médio":"Tenda de lona com palhaços, mágicos, trapezistas e muitos malabaristas.","Fácil":"Espetáculo itinerante sob grande lona colorida, com palhaços, trapezistas, mágicos e malabaristas encantando o público."}},{"tema":"lugar","palavra":"AQUÁRIO","dicas":{"Difícil":"Peixes nadando atrás do vidro.","Médio":"Tem tanques de vidro cheios de peixes e animais marinhos.","Fácil":"Espaço com tanques de vidro, onde visitantes observam peixes, tubarões, tartarugas e outros animais marinhos."}},{"tema":"lugar","palavra":"PISCINA","dicas":{"Difícil":"Água azul com cloro, mergulho.","Médio":"Grande tanque com água clorada, perfeito para nadar no verão.","Fácil":"Tanque com água azulada, em clubes ou casas, onde nadamos e pulamos do trampolim alto."}},{"tema":"lugar","palavra":"ACADEMIA","dicas":{"Difícil":"Pesos, esteiras e muito suor.","Médio":"Tem esteiras, pesos e aparelhos para malhar e ganhar músculos.","Fácil":"Espaço com esteira os carregam e descarregam mercadorias."}},{"tema":"lugar","palavra":"FAROL","dicas":{"Difícil":"Torre com luz guiando navios.","Médio":"Torre alta no litoral com luz giratória que orienta navegantes.","Fácil":"Torre alta à beira-mar, com luz potente que gira à noite para orientar os navios."}},{"tema":"lugar","palavra":"PLANETÁRIO","dicas":{"Difícil":"Cúpula que mostra o céu.","Médio":"Cúpula onde projetam estrelas e constelações para estudarmos o universo.","Fácil":"Prédio com cúpula onde se projetam estrelas, constelações e galáxias, como numa incrível viagem espacial."}},{"tema":"lugar","palavra":"LAVANDERIA","dicas":{"Difícil":"Máquinas limpam e secam roupas.","Médio":"Onde deixamos roupas sujas e as recebemos limpas e passadas.","Fácil":"Estabelecimento com máquinas, onde deixamos roupas sujas e buscamos depois tudo limpo, seco e passado."}},{"tema":"lugar","palavra":"LABORATÓRIO","dicas":{"Difícil":"Cientistas fazem experimentos com jalecos.","Médio":"Tem tubos de ensaio e microscópios, onde cientistas fazem experimentos.","Fácil":"Ambiente com microscópios, tubos de ensaio e jalecos, onde cientistas realizam experimentos e analisam amostras."}},{"tema":"lugar","palavra":"DELEGACIA","dicas":{"Difícil":"Onde registramos boletim de ocorrência.","Médio":"Lugar onde policiais trabalham e pessoas registram boletins de ocorrência.","Fácil":"Repartição da polícia civil onde se registram boletins de ocorrência e investigadores apuram os crimes."}},{"tema":"lugar","palavra":"LAGO","dicas":{"Difícil":"Água parada cercada de terra.","Médio":"Porção de água doce cercada de terra, ótima para pescar.","Fácil":"Porção de água doce cercada de terra, onde podemos pescar, remar ou andar de pedalinho."}},{"tema":"lugar","palavra":"SORVETERIA","dicas":{"Difícil":"Casquinhas geladas de vários sabores.","Médio":"Loja que vende casquinhas, picolés e taças de vários sabores.","Fácil":"Loja procurada no calor, que vende casquinhas, picolés e milkshakes de chocolate, morango e flocos."}}];

const MAX = 6;
const NIVEIS = ["Fácil", "Médio", "Difícil"];
const NIVEL_DESC = { "Fácil": "Dica detalhada", "Médio": "Dica moderada", "Difícil": "Dica curta" };
const PONTOS_BASE = { "Fácil": 10, "Médio": 20, "Difícil": 30 };
const TECLADO = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
const TEMAS = [...new Set(PALAVRAS.map(p => p.tema))].sort();

const $ = id => document.getElementById(id);
const semAcento = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const isLetra = ch => /\p{L}/u.test(ch);

/* ---------- Estado persistente (opcional; funciona sem localStorage) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("forca_" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("forca_" + k, JSON.stringify(v)); } catch {} }
};
const S = {
  nivel: store.get("nivel", "Médio"),
  tema: store.get("tema", "todos"),
  placar: store.get("placar", { pontos: 0, seq: 0, melhor: 0, vit: 0, der: 0 }),
  usadas: new Set(),
};
if (!NIVEIS.includes(S.nivel)) S.nivel = "Médio";
if (S.tema !== "todos" && !TEMAS.includes(S.tema)) S.tema = "todos";
/* ---------- Sons sintetizados com Web Audio API (sem arquivos externos) ---------- */
const Som = {
  ctx: null,
  on: store.get("som", true),
  init() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  tom(freq, ini, dur, { tipo = "sine", vol = 0.2, ate = null } = {}) {
    const c = this.ctx, t = c.currentTime + ini;
    const o = c.createOscillator(), g = c.createGain();
    o.type = tipo;
    o.frequency.setValueAtTime(freq, t);
    if (ate) o.frequency.exponentialRampToValueAtTime(ate, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  tocar(nome) {
    if (!this.on || !this.init()) return;
    const T = (...a) => this.tom(...a);
    switch (nome) {
      case "acerto":   // "plim" ascendente
        T(660, 0, 0.12, { tipo: "triangle", vol: 0.22 });
        T(990, 0.07, 0.18, { tipo: "triangle", vol: 0.22 });
        break;
      case "erro":     // zumbido grave descendente
        T(200, 0, 0.3, { tipo: "square", vol: 0.07, ate: 95 });
        T(140, 0, 0.3, { tipo: "sine", vol: 0.2, ate: 70 });
        break;
      case "vitoria":  // arpejo maior + acorde final
        [523, 659, 784, 1047].forEach((f, i) => T(f, i * 0.11, 0.24, { tipo: "triangle", vol: 0.2 }));
        [784, 1047, 1319].forEach(f => T(f, 0.46, 0.7, { tipo: "triangle", vol: 0.12 }));
        break;
      case "derrota":  // cromática descendente, nota final longa
        [392, 370, 349, 330].forEach((f, i) =>
          T(f, i * 0.3, i === 3 ? 0.9 : 0.3, { tipo: "sawtooth", vol: 0.06, ate: i === 3 ? 300 : null }));
        [196, 185, 175, 165].forEach((f, i) => T(f, i * 0.3, i === 3 ? 0.9 : 0.3, { tipo: "sine", vol: 0.15 }));
        break;
      case "clique":
        T(520, 0, 0.05, { vol: 0.05 });
        break;
    }
  },
  alternar() {
    this.on = !this.on; store.set("som", this.on);
    atualizarSom();
    this.tocar("clique");
  },
};
function atualizarSom() {
  $("btnSom").textContent = Som.on ? "🔊" : "🔇";
  $("btnSom").setAttribute("aria-label", Som.on ? "Desligar som" : "Ligar som");
  $("btnSomMenu").textContent = Som.on ? "🔊 Som ligado" : "🔇 Som desligado";
}

let J = null;          // partida atual
let tela = "menu";

/* ---------- Menu ---------- */
function renderMenu() {
  $("levels").innerHTML = NIVEIS.map(n => `
    <button class="level ${n === S.nivel ? "sel" : ""}" data-n="${n}">
      <b>${n}</b><span>${NIVEL_DESC[n]}</span><small>${PONTOS_BASE[n]} pts + bônus</small>
    </button>`).join("");
  const opts = ["todos", ...TEMAS];
  $("themes").innerHTML = opts.map(t => {
    const q = t === "todos" ? PALAVRAS.length : PALAVRAS.filter(p => p.tema === t).length;
    return `<button class="theme ${t === S.tema ? "sel" : ""}" data-t="${t}">${cap(t)}<em>(${q})</em></button>`;
  }).join("");
  const P = S.placar;
  $("statsLine").textContent = (P.vit + P.der)
    ? `Pontos: ${P.pontos} · Vitórias: ${P.vit} · Derrotas: ${P.der} · Melhor sequência: ${P.melhor}` : "";
}
$("levels").addEventListener("click", e => {
  const b = e.target.closest(".level"); if (!b) return;
  S.nivel = b.dataset.n; store.set("nivel", S.nivel); Som.tocar("clique"); renderMenu();
});
$("themes").addEventListener("click", e => {
  const b = e.target.closest(".theme"); if (!b) return;
  S.tema = b.dataset.t; store.set("tema", S.tema); Som.tocar("clique"); renderMenu();
});

function mostrar(qual) {
  tela = qual;
  $("menu").classList.toggle("hidden", qual !== "menu");
  $("game").classList.toggle("hidden", qual !== "jogo");
  $("overlay").classList.add("hidden");
  if (qual === "menu") renderMenu();
  window.scrollTo(0, 0);
}

/* ---------- Partida ---------- */
function sortear() {
  const pool = PALAVRAS.filter(p => (S.tema === "todos" || p.tema === S.tema) && p.dicas[S.nivel]);
  const id = p => p.tema + "|" + p.palavra;
  let disp = pool.filter(p => !S.usadas.has(id(p)));
  if (!disp.length) { pool.forEach(p => S.usadas.delete(id(p))); disp = pool; }
  const p = disp[Math.floor(Math.random() * disp.length)];
  S.usadas.add(id(p));
  return p;
}

function novaPartida() {
  const p = sortear();
  J = {
    p, chances: MAX, tentadas: new Set(), acertos: new Set(), comprou: false,
    fim: false, venceu: false, ganho: 0,
    letras: new Set([...p.palavra].filter(isLetra).map(semAcento)),
  };
  mostrar("jogo");
  renderKbd();
  renderJogo();
}

const temaVisivel = () => S.tema !== "todos" || J.chances < MAX || J.fim;
const dicaVisivel = () => J.comprou || J.chances <= 1 || J.fim;

function jogar(letra) {
  if (tela !== "jogo" || !J || J.fim || J.tentadas.has(letra)) return;
  J.tentadas.add(letra);
  const key = document.querySelector(`.key[data-l="${letra}"]`);
  if (J.letras.has(letra)) {
    J.acertos.add(letra);
    key && key.classList.add("ok");
    if ([...J.letras].every(l => J.acertos.has(l))) return terminar(true);
    Som.tocar("acerto");
    renderJogo(letra);
  } else {
    J.chances--;
    key && key.classList.add("bad");
    if (J.chances === 0) return terminar(false);
    Som.tocar("erro");
    renderJogo(null, true);
  }
  if (key) key.disabled = true;
}

function comprarDica() {
  if (J.fim || dicaVisivel() || J.chances <= 1) return;
  J.comprou = true; J.chances--;
  Som.tocar("erro");
  renderJogo(null, true);
}

function terminar(venceu) {
  J.fim = true; J.venceu = venceu;
  const P = S.placar;
  if (venceu) {
    J.ganho = PONTOS_BASE[S.nivel] + 5 * J.chances;
    P.pontos += J.ganho; P.vit++; P.seq++; P.melhor = Math.max(P.melhor, P.seq);
  } else { P.der++; P.seq = 0; }
  store.set("placar", P);
  Som.tocar(venceu ? "vitoria" : "derrota");
  renderJogo(null, !venceu);
  document.querySelectorAll(".key").forEach(k => k.disabled = true);
  if (venceu) confete();
  setTimeout(mostrarResultado, 900);
}

/* ---------- Render do jogo ---------- */
function quebrar(palavra, max = 14) {
  if (palavra.length <= max) return [palavra];
  const partes = palavra.split(/(?<=[-\s])/);
  const linhas = []; let atual = "";
  for (const p of partes) {
    if (atual && (atual + p).trimEnd().length > max) { linhas.push(atual.trimEnd()); atual = p; }
    else atual += p;
  }
  linhas.push(atual.trimEnd());
  return linhas;
}

function renderJogo(novaLetra = null, errou = false) {
  const P = S.placar;
  $("sPts").textContent = P.pontos; $("sSeq").textContent = P.seq;
  $("sWin").textContent = P.vit; $("sLose").textContent = P.der;

  // Forca
  const erros = MAX - J.chances;
  for (let i = 0; i < MAX; i++) {
    const el = $("p" + i);
    el.classList.toggle("on", i < erros);
    el.classList.remove("flash");
  }
  if (errou && erros > 0 && !J.fim) {
    const ult = $("p" + (erros - 1));
    ult.classList.add("flash");
    setTimeout(() => ult.classList.remove("flash"), 380);
  }
  const perdeu = J.fim && !J.venceu;
  $("gallows").classList.toggle("lost", perdeu);
  desenharRosto(erros, perdeu);

  $("livesTxt").textContent = `${J.chances} de ${MAX} chances`;
  const heart = '<svg viewBox="0 0 24 22"><path d="M12 21 1.8 10.9A6 6 0 0 1 12 3.3a6 6 0 0 1 10.2 7.6Z"/></svg>';
  $("hearts").innerHTML = Array.from({ length: MAX }, (_, i) =>
    `<span class="${i < J.chances ? "" : "lost"}">${heart}</span>`).join("");

  // Chips
  $("chipLvl").textContent = "Nível: " + S.nivel;
  $("chipTema").textContent = "Tema: " + (temaVisivel() ? cap(J.p.tema) : "? ? ?");
  $("temaNote").classList.toggle("hidden", temaVisivel());

  // Palavra
  const linhas = quebrar(J.p.palavra);
  const n = Math.max(...linhas.map(l => l.length));
  const largura = $("word").clientWidth || 560;
  const s = Math.max(18, Math.min(54, Math.floor(largura / n)));
  const w = $("word");
  w.style.setProperty("--s", s + "px");
  w.classList.toggle("win", J.venceu);
  w.innerHTML = linhas.map(linha => `<div class="line">${[...linha].map(ch => {
    if (!isLetra(ch)) return `<div class="slot sep"><span>${ch === " " ? "" : ch}</span></div>`;
    const base = semAcento(ch);
    const rev = J.acertos.has(base);
    const cls = rev ? "rev" : (perdeu ? "miss" : "");
    const anim = rev && base === novaLetra ? "" : ' style="animation:none"';
    const txt = rev || perdeu ? ch : "";
    return `<div class="slot letter ${cls}"><span${anim}>${txt}</span></div>`;
  }).join("")}</div>`).join("");
  if (errou) { w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake"); }

  // Dica
  const h = $("hint");
  if (dicaVisivel()) {
    const dica = J.p.dicas[S.nivel] || Object.values(J.p.dicas)[0];
    h.innerHTML = `<h3>DICA</h3><p></p>`;
    h.querySelector("p").textContent = dica;
  } else {
    h.innerHTML = `<h3>DICA</h3><p class="wait">Revelada quando restar 1 chance.</p>` +
      (J.chances > 1 ? `<button class="buy" id="btnBuy">Revelar agora (−1 chance)</button>` : "");
    const b = $("btnBuy"); if (b) b.onclick = comprarDica;
  }
}

function desenharRosto(erros, perdeu) {
  const f = $("face");
  f.classList.toggle("hidden", erros < 1);
  if (perdeu) {
    f.innerHTML = `<path d="M280 103 l12 12 M292 103 l-12 12 M308 103 l12 12 M320 103 l-12 12"/>
                   <path d="M286 135 q14 -12 28 0"/>`;
  } else if (J.venceu) {
    f.innerHTML = `<circle class="eye-dot" cx="286" cy="109" r="4" fill="var(--body)" stroke="none"/>
                   <circle class="eye-dot" cx="314" cy="109" r="4" fill="var(--body)" stroke="none"/>
                   <path d="M283 124 q17 16 34 0"/>`;
  } else {
    f.innerHTML = `<circle class="eye-dot" cx="286" cy="109" r="4" fill="var(--body)" stroke="none"/>
                   <circle class="eye-dot" cx="314" cy="109" r="4" fill="var(--body)" stroke="none"/>
                   <path d="M288 130 H312"/>`;
  }
}

function renderKbd() {
  $("kbd").innerHTML = TECLADO.map(row =>
    `<div class="krow">${[...row].map(l => `<button class="key" data-l="${l}">${l}</button>`).join("")}</div>`).join("");
}
$("kbd").addEventListener("click", e => {
  const k = e.target.closest(".key"); if (k && !k.disabled) jogar(k.dataset.l);
});

/* ---------- Resultado ---------- */
function mostrarResultado() {
  if (tela !== "jogo" || !J.fim) return;
  const m = $("modal");
  m.classList.toggle("lose", !J.venceu);
  $("rTitle").textContent = J.venceu ? "Você venceu!" : "Você perdeu!";
  $("rWord").textContent = J.p.palavra;
  $("rGain").textContent = J.venceu
    ? `+${J.ganho} pontos · sequência de ${S.placar.seq}` : "A sequência foi zerada. Tente de novo!";
  $("rDet").textContent = `Tema: ${cap(J.p.tema)} — ${J.p.dicas[S.nivel] || ""}`;
  $("overlay").classList.remove("hidden");
  $("btnAgain").focus();
}

/* ---------- Confete ---------- */
function confete() {
  const cv = $("confetti"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cores = ["#f59e0b", "#38bdf8", "#22c55e", "#f472b6", "#a78bfa", "#facc15"];
  const ps = Array.from({ length: 160 }, () => ({
    x: Math.random() * innerWidth, y: -Math.random() * 300 - 10,
    vx: (Math.random() - .5) * 5, vy: 3 + Math.random() * 4,
    s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
    c: cores[Math.floor(Math.random() * cores.length)],
  }));
  let n = 0;
  (function passo() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; p.vy += .12; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s * .3, p.s, p.s * .6); ctx.restore();
    }
    if (++n < 170) requestAnimationFrame(passo); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

/* ---------- Eventos ---------- */
$("btnPlay").onclick = novaPartida;
$("btnSom").onclick = () => Som.alternar();
$("btnSomMenu").onclick = () => Som.alternar();
$("btnAgain").onclick = novaPartida;
$("btnMenu").onclick = () => mostrar("menu");
$("btnMenu2").onclick = () => mostrar("menu");
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Enter") {
    if (tela === "menu" || (tela === "jogo" && J && J.fim)) { e.preventDefault(); novaPartida(); }
    return;
  }
  if (e.key === "Escape") { if (tela === "jogo") mostrar("menu"); return; }
  const l = semAcento(e.key || "").toUpperCase();
  if (l.length === 1 && l >= "A" && l <= "Z") jogar(l);
});
addEventListener("resize", () => { if (tela === "jogo" && J) renderJogo(); });

atualizarSom();
renderMenu();
</script>
